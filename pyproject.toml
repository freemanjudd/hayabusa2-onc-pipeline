# This file exists mainly to configure ruff + pytest. The runtime scripts are
# plain stdlib and are run directly (python scripts/<name>.py), not installed.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hayabusa2-onc-pipeline"
version = "0.1.0"
description = "Ingest, calibrate (via ISIS in CI) and display Hayabusa2 ONC-W2 Earth-flyby imagery."
readme = "README.md"
requires-python = ">=3.9"
# Runtime scripts (download_data.py, make_manifest.py) use only the Python
# standard library on purpose, so they run on a bare machine with no installs.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
